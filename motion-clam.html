          <h1><span class="timestamp">动态视觉</span><br>Clam <span class="work-en">品牌动态标志设计</span></h1>
          <p>以「汇聚与生成」为动态概念，将来自不同方向的彩色节点、线条与运动轨迹逐步组合，最终形成 Clam 品牌字标。画面采用大面积留白与蓝、绿、橙、洋红等高饱和色彩，动画由分散到聚合、由多彩到统一，呈现轻快、年轻且富有活力的品牌气质，可应用于网站入口、品牌片头及数字媒体传播场景。时长 6 秒。</p>
