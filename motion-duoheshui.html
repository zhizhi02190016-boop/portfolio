          <p>以「天热，多喝水」为核心信息，通过直观而轻松的视觉语言传达夏季补水提醒。画面采用真实晴空与云层作为背景，以高饱和橙色手写字体作为视觉主体，利用蓝色与橙色的强烈冷暖对比，强化炎热天气下的视觉冲击与传播效率。动画从分散的字体笔画和多层色块开始，通过逐步拼合、覆盖与色彩转换形成完整文案，最终统一为醒目的橙色标题。时长 7 秒。</p>
